name: Revisão por IA

on:
  pull_request:
    branches: [main]

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Detetar vulnerabilidade com IA (Simulação)
        run: |
          echo "A analisar os ficheiros modificados..."
          # Procura por DROP TABLE em qualquer ficheiro .sql alterado
          if git diff --name-only origin/main...HEAD | xargs -I {} grep -q "DROP TABLE" {} 2>/dev/null; then
            echo "::error:: ALERTA DE SEGURANÇA (IA): Comando perigoso 'DROP TABLE' detetado no código!"
            exit 1
          else
            echo "Nenhuma vulnerabilidade detetada."
          fi